[project]
name = "colabkit"
version = "0.1.0"
description = "Sync and async clients for Google's `colab` CLI, and an SSH tunnel through it"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PTH", "ASYNC", "S", "N", "PL", "PT", "TID",
    "PERF", "RET", "PIE", "FURB", "LOG", "G", "DTZ", "ISC",
]
ignore = [
    "PLR0913", # too many arguments: CLI wrappers mirror the CLI's options
    "PLR0917", # too many positional arguments: same
    "ASYNC109", # explicit `timeout` params on subprocess wrappers are intentional
    "PLR2004", # magic values
    "S101",    # assert
    "S603",    # subprocess with argv lists is the point of this package
    "N818",    # SessionGone, ColabMissing: names kept from the projects that use them
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
